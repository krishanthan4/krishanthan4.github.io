<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to GitHub...</title>
    <meta http-equiv="refresh" content="0; url=https://github.com/krishanthan4">
    <link rel="canonical" href="https://github.com/krishanthan4">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #fff;
            color: #333;
        }
        .container {
            text-align: center;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #000;
            text-decoration: none;
        }
    </style>
    <script>
        // Immediate redirect via JavaScript as backup
        window.location.replace("https://github.com/krishanthan4");
    </script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Redirecting to GitHub...</p>
        <p><a href="https://github.com/krishanthan4">Click here if you are not redirected automatically</a></p>
    </div>
</body>
</html>
